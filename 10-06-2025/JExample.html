<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav {
            position: sticky;
            top: 0;
        }

        ul {
            display: flex;
            background-color: #9f9d9d82;
            padding: 0 5px;
            font-size: x-large;
        }

        li {
            margin: 0 10px;
            list-style-type: none;
        }

        li a {
            text-decoration: none;
            color: white;
        }

        .active {
            background-color: chartreuse;
        }

        .text {
            height: 100em;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="#">Home</a></li>
        </ul>
    </nav>

    <div class="text">

    </div>

</body>

</html>
