<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: rgb(85, 0, 128);
            display: flex;
            justify-content: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 130px 130px 130px 130px 130px 130px;
            grid-template-rows: 130px 130px 130px;
            grid-template-areas:
                "box1 box2 box2 box3 box4 box5"
                "box6 box6 box7 box3 box4 box5"
                "box8 box9 box7 box3 box4 box5";
            gap: 5px;
        }

        .box {
            background: linear-gradient(90deg, aqua, skyblue);
        }

        .box1 {
            box-shadow: inset -15px 0 30px -12px rgba(0, 0, 0, 0.8);
        }

        .box4,
        .box5 {
            box-shadow: inset 15px 0 30px -12px rgba(0, 0, 0, 0.8);
        }

        .box5 {
            border-radius: 0 0 50px 0;
        }

        .box6 {
            box-shadow: inset -10px 10px 40px -12px rgba(0, 0, 0, 0.8);
        }

        .box8 {
            border-radius: 0 0 0 50px;
            box-shadow: inset -10px 10px 40px -12px rgba(0, 0, 0, 0.8);
        }

        .box9,
        .box7 {
            box-shadow: inset -10px 10px 40px -12px rgba(0, 0, 0, 0.8);
        }

        .box3,
        .box4,
        .box5 {
            background: linear-gradient(90deg, hotpink, rgb(219, 128, 128));
        }

        /* .main {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100dvh;
        } */

    </style>
</head>

<body>
    <div class="main">
        <div class="grid-container">
            <div class="box box1" style="grid-area: box1;"></div>
            <div class="box box2" style="grid-area: box2;"></div>
            <div class="box box3" style="grid-area: box3;"></div>
            <div class="box box4" style="grid-area: box4;"></div>
            <div class="box box5" style="grid-area: box5;"></div>
            <div class="box box6" style="grid-area: box6;"></div>
            <div class="box box7" style="grid-area: box7;"></div>
            <div class="box box8" style="grid-area: box8;"></div>
            <div class="box box9" style="grid-area: box9;"></div>
        </div>
       
    </div>
</body>

</html>
