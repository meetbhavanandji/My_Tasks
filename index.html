    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            /* background: linear-gradient(to right, #0f2027, #203a43, #2c5364); */
            /* background: linear-gradient(to right, #1c1c1c, #3e3e3e, #d4af37); */
            /* background: linear-gradient(to right, #f8f4f0, #e0c3fc, #8ec5fc); */
            /* background: linear-gradient( 110deg , #2c003e, #6a0572, #ab83a1); */
            /* background: linear-gradient(to right, #ff6e7f, #bfe9ff, #7ed6df); */
            /* background: linear-gradient(to right, #355c7d, #6c5b7b, #c06c84); */
            background: linear-gradient(to right, #0f9b8e, #2d3e50, #16222a);
            /* background: linear-gradient(to right, #4b6cb7, #182848, #74ebd5); */
            /* background: linear-gradient(to right, #fdfcfb, #e2d1c3, #d3cbb8); */
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        header {
            padding: 40px 20px 10px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
        }

        /* Grid of buttons */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            width: 100%;
            padding: 10px;
        }

        .grid a {
            /* background-color: #ffffff10; */
            background: rgba(0, 0, 0, 0.1);
            /* filter: blur(5px); */
            border: 1px solid #2d3e50;
            text-align: center;
            padding: 20px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .grid a:hover {
            background-color: #ffffff20;
            transform: translateY(-5px);
            border-color: #ffffff50;
        }
    </style>
</head>

<body>
    <header>
        <h1>Frontend Projects</h1>
    </header>
