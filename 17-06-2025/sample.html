<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            display: flex;
            justify-content: center;

        }

        .next-btn {
            position: relative;
            padding-right: 30px;
        }

        .next-btn::after {
            content: "→";
            position: absolute;
            right: 10px;
            transition: 0.3s;

        }

        .next-btn:hover::after {
            right: 5px;
        }
    </style>
</head>

<body>
    <div>

        <button class="next-btn">Next</button>
    </div>

</body>

</html>
