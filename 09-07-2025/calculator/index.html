<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh
        }

        table,
        td {
            border: 1px solid #000;
            border-collapse: collapse;
            text-align: center
        }

        td {
            cursor: pointer;
            font-size: 20px;
            padding: 10px
        }

        #output,
        #answer {
            width: 220px;
            height: 30px;
            background: #333;
            color: #fff;
            margin: 2px
        }
    </style>
</head>

<body>

    <div>
        <div id="output"></div>
        <div id="answer"></div>

        <table>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>C</td>
                <td rowspan="4">DEL</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>+</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>-</td>
            </tr>
            <tr>
                <td>0</td>
                <td>.</td>
                <td>^</td>
                <td>=</td>
            </tr>
        </table>
    </div>

    <script>
        let o = output, a = answer;
        document.querySelectorAll("td").forEach(b => {
            b.onclick = () => {
                let v = b.innerText;
                if (v == "C") { o.innerText = ""; a.innerText = "" }
                else if (v == "DEL") { o.innerText = o.innerText.slice(0, -1) }
                else if (v == "=") { try { a.innerText = eval(o.innerText).toFixed(3) } catch { alert("Error") } }
                else if (v == "^") { o.innerText += "**" }
                else { o.innerText += v }
            }
        })
    </script>

</body>

</html>
